input_only_pins: [34, 35, 36, 39]      # DS v0.7 Table 2 — four Type I pins
strapping_pins:  [0, 5, 12, 15]        # DS v0.7 §3.3 — MTDI(12)/MTDO(15)/GPIO0/GPIO5; GPIO2 is RF switch test point
reserved_pins:   [2, 6, 7, 8, 9, 10, 11, 25]  # GPIO2/25 = RF switch (not user-accessible); GPIO6-11 = SPI flash

validations:
