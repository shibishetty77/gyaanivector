  - {gpio: 1,  input_only: false, adc: null,        pwm: true,  strapping: false}   # pin37 — U0TXD
  - {gpio: 3,  input_only: false, adc: null,        pwm: true,  strapping: false}   # pin36 — U0RXD
  - {gpio: 4,  input_only: false, adc: "ADC2_CH0", pwm: true,  strapping: false}   # pin28 — IO4
  - {gpio: 5,  input_only: false, adc: null,        pwm: true,  strapping: true }   # pin31; strapping (SDIO timing)
  - {gpio: 12, input_only: false, adc: "ADC2_CH5", pwm: true,  strapping: true }   # pin14; MTDI strapping
  - {gpio: 13, input_only: false, adc: "ADC2_CH4", pwm: true,  strapping: false}   # pin17 — IO13
