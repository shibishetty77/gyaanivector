# Cross-referenced: Table 2 Pin Definitions (§3.2), Strapping §3.3,
#                   Block Diagram §2, Features §1.1
#
# NOTE: EOL (End of Life) product. 41-pin module.
# CRITICAL: GPIO2 and GPIO25 on the ESP32-D0WD-V3 chip ARE on the module as test
# points but are NOT led out to user-accessible pins — they are used internally to
# control the dual-antenna RF switch (DS v0.7 §3.2 footnote 2 + Table 3).
# GPIO6-11 are tied to SPI flash and are not led out (EOL disclaimer).
# Input-only (Type I): GPIO34, GPIO35, GPIO36 (SENSOR_VP), GPIO39 (SENSOR_VN).
# GPIO16, GPIO17 are exposed. NOTE: this is a dual-antenna module.
# =============================================================================

id: esp32-wroom-da
class: [platform]
mcu: ESP32-D0WD-V3              # DS v0.7 Block Diagram §2 — ESP32-D0WD-V3 chip
framework: arduino
flash_kb: 8192                  # DS v0.7 §1.1 — 8 MB SPI flash
ram_kb: 520                     # DS v0.7 §1.1 — 520 KB SRAM

i2c: {default_sda: 21, default_scl: 22, default_hz: 100000}   # arduino-esp32 Wire default — FRAMEWORK
adc: {adc2_wifi_conflict: true}                                # ESP-IDF errata

# Per-pin records verified against DS v0.7 Table 2 (§3.2). 41-pin module.
# GPIO2, GPIO25 = RF switch test points, NOT led out to accessible pins.
# GPIO6-11 = SPI flash, not led out.
pins:
