# =============================================================================
# ✅  ENGINEER-SIGNED-OFF (Kiran Nayak, 2026-07-12). Every silicon value was
#     cross-checked against ESP32-WROOM-32 Datasheet v3.6 — Table 2 (§2.2 Pin
#     Definitions), Table 3 (§3 Strapping Pins), §1.1 Features (memory/flash).
#
# ℹ️  LIFECYCLE — NRND. Now a typed, machine-checkable fact (see `lifecycle:` below),
#     not prose: status=nrnd, successor=esp32-wroom-32e, since=2025-08-08 (DS v3.6).
#     WROOM-32 is still the most common module in the field, so authoring it is correct;
#     the decision layer will soft-recommend -32E for NEW designs (Phase-1+, never a block).
#
# FRAMEWORK-SOURCED (NOT in this datasheet — confirm separately before sign-off):
#   - i2c default_sda/scl : ESP32 I2C is remappable to almost any GPIO; 21/22 is
#     the arduino-esp32 Wire default, a FRAMEWORK convention, not silicon.
#   - adc2_wifi_conflict  : documented in ESP-IDF ADC notes / ESP32 errata, not here.
# =============================================================================

id: esp32-wroom-32
mcu: ESP32-D0WDQ6                 # DS v3.6 §1.1 (Xtensa dual-core LX6, up to 240 MHz)
framework: arduino
flash_kb: 4096                    # DS v3.6 §1.1 — 4 MB integrated SPI flash
ram_kb: 520                       # DS v3.6 §1.1 — 520 KB SRAM (+448 KB ROM, +8 KB RTC SRAM as v3.6 lists it; chip is 16 KB RTC total = 8 FAST+8 SLOW, under-listed in v3.6 — same silicon as -32E, which lists 16)

i2c: { default_sda: 21, default_scl: 22, default_hz: 100000 }   # FRAMEWORK (arduino-esp32 Wire default) — NOT datasheet
adc: { adc2_wifi_conflict: true }                               # ESP-IDF/errata — NOT this datasheet

# Per-pin records — verified against DS v3.6 Table 2 (§2.2). Only pins BONDED on the
# module and usable as GPIO (flash pins 6-11 are in reserved_pins, not here).
# adc = the exact "ADCx_CHy" from Table 2. Type "I" pins = input-only (no output/pull).
pins:
  - {gpio: 0,  input_only: false, adc: "ADC2_CH1", pwm: true,  strapping: true }   # Table2 pin25; strapping (boot mode)
  - {gpio: 1,  input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin35 — U0TXD (console)
  - {gpio: 2,  input_only: false, adc: "ADC2_CH2", pwm: true,  strapping: true }   # Table2 pin24; strapping (boot mode)
  - {gpio: 3,  input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin34 — U0RXD (console)
  - {gpio: 4,  input_only: false, adc: "ADC2_CH0", pwm: true,  strapping: false}   # Table2 pin26
  - {gpio: 5,  input_only: false, adc: null,        pwm: true,  strapping: true }   # Table2 pin29; strapping (SDIO timing)
  - {gpio: 12, input_only: false, adc: "ADC2_CH5", pwm: true,  strapping: true }   # Table2 pin14 = MTDI; strapping (flash voltage)
  - {gpio: 13, input_only: false, adc: "ADC2_CH4", pwm: true,  strapping: false}   # Table2 pin16
  - {gpio: 14, input_only: false, adc: "ADC2_CH6", pwm: true,  strapping: false}   # Table2 pin13
  - {gpio: 15, input_only: false, adc: "ADC2_CH3", pwm: true,  strapping: true }   # Table2 pin23 = MTDO; strapping (U0TXD printing)
  - {gpio: 16, input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin27
  - {gpio: 17, input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin28
  - {gpio: 18, input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin30 — VSPICLK
  - {gpio: 19, input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin31 — VSPIQ
  - {gpio: 21, input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin33 — VSPIHD (I2C SDA default)
  - {gpio: 22, input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin36 — VSPIWP (I2C SCL default)
  - {gpio: 23, input_only: false, adc: null,        pwm: true,  strapping: false}   # Table2 pin37 — VSPID
  - {gpio: 25, input_only: false, adc: "ADC2_CH8", pwm: true,  strapping: false}   # Table2 pin10 — also DAC_1
  - {gpio: 26, input_only: false, adc: "ADC2_CH9", pwm: true,  strapping: false}   # Table2 pin11 — also DAC_2
  - {gpio: 27, input_only: false, adc: "ADC2_CH7", pwm: true,  strapping: false}   # Table2 pin12
  - {gpio: 32, input_only: false, adc: "ADC1_CH4", pwm: true,  strapping: false}   # Table2 pin8 — XTAL_32K_P, TOUCH9
  - {gpio: 33, input_only: false, adc: "ADC1_CH5", pwm: true,  strapping: false}   # Table2 pin9 — XTAL_32K_N, TOUCH8
  - {gpio: 34, input_only: true,  adc: "ADC1_CH6", pwm: false, strapping: false,
     source: "DS v3.6 Table 2 §2.2 — Type I (input-only)"}
  - {gpio: 35, input_only: true,  adc: "ADC1_CH7", pwm: false, strapping: false,
     source: "DS v3.6 Table 2 §2.2 — Type I (input-only)"}
  - {gpio: 36, input_only: true,  adc: "ADC1_CH0", pwm: false, strapping: false,
     source: "DS v3.6 Table 2 §2.2 — SENSOR_VP, Type I (input-only)"}
  - {gpio: 39, input_only: true,  adc: "ADC1_CH3", pwm: false, strapping: false,
     source: "DS v3.6 Table 2 §2.2 — SENSOR_VN, Type I (input-only)"}

input_only_pins: [34, 35, 36, 39]      # DS v3.6 Table 2 — the four "Type I" pins
strapping_pins:  [0, 2, 5, 12, 15]     # DS v3.6 Table 3 — GPIO0/2/5 + MTDI(12)/MTDO(15)
reserved_pins:   [6, 7, 8, 9, 10, 11]  # DS v3.6 Table 2 footnote 2 — SPI flash, never expose to codegen

# Deterministic guarantee: an output assigned to an input-only pin is BLOCKED.
validations:
  - {shape: forbidden_pin, pin_role: output, not_in: input_only_pins, severity: hard_constraint}

sources: [espressif-esp32-wroom-32-ds-v3.6]   # every fact here traces to this one doc; registered in SOURCES.md
source: "ESP32-WROOM-32 Datasheet v3.6 (Table 2 §2.2, Table 3 §3); i2c/adc2 flags are framework/errata-sourced"
sdk_validated: "arduino-esp32 2.0.14"   # CONFIRM against the toolchain you actually build with
reviewed_by: "Kiran Nayak"
review: { status: approved, by: "Kiran Nayak", at: "2026-07-12", method: manual_primary_source_check }

# Machine-checkable part lifecycle (was a page-header comment; now a typed Layer-1 fact).
# The "prefer successor for new designs" advisory is a Layer-3 decision-engine policy
# (soft recommend, never a block), Phase-1+ — not built here.
lifecycle:
  status: nrnd
  recommended_alternatives: [esp32-wroom-32e]   # resolves to the -32E fact — validate_all checks this
  since: "2025-08-08"                             # DS v3.6 release date
